<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小吕布量化 · 终极星际指挥台</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0e1117; }
        
        /* 仅保留视频背景 */
        #video-bg {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%; width: auto; height: auto;
            z-index: -3; object-fit: cover; opacity: 0.85; mix-blend-mode: screen;
        }

        /* Iframe 铺满全屏，一切 UI 交给内部的 Python 渲染 */
        iframe { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; border: none; 
            background-color: transparent !important; 
        }
    </style>
</head>
<body>
    <video autoplay muted loop playsinline id="video-bg">
        <source src="bg.mp4" type="video/mp4">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-1610-large.mp4" type="video/mp4">
    </video>

    <iframe 
        src="https://lianghua-system---xlb-eyrzwdbv6phkgnhkp9goxe.streamlit.app/?embed=true"
        allow="camera; microphone; clipboard-read; clipboard-write;"
        allowtransparency="true">
    </iframe>
</body>
</html>
